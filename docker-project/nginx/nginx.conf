# ============================================================
# Nginx — обратный прокси перед Node.js (Express)
# Внешние клиенты идут на 52211 (HTTPS, т.к. провайдер блокирует 443).
# HTTP 80 → 301 redirect на https://<host>:52211
# Запускается в Docker. SSL терминируется здесь, к Node идёт plain HTTP
# через docker network, что снимает нагрузку с Node.
# ============================================================

# Блокировка сканеров по User-Agent ещё до прокси
map $http_user_agent $block_bot {
    default 0;
    ~*nikto       1;
    ~*sqlmap      1;
    ~*nmap        1;
    ~*masscan     1;
    ~*zgrab       1;
    ~*httpx       1;
    ~*python-requests 1;
    ~*Go-http-client  1;
    ~*java        1;
}

# ============================================================
# HTTP → HTTPS redirect (порт 80)
# Слушаем 80, чтобы любой кто открыл http:// автоматически
# попадал на безопасный https://host:52211/...
# ============================================================
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    # 301 — постоянный редирект, браузер закэширует и больше не пойдёт по HTTP
    return 301 https://$host:52211$request_uri;
}

# ============================================================
# HTTPS — основной сервер (порт 52211)
# ============================================================
server {
    listen 52211 ssl http2;
    listen [::]:52211 ssl http2;
    server_name 5.35.114.217 _;

    # ---- SSL ----
    ssl_certificate     /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # HSTS — браузер запомнит «только https» на год
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Базовые security-заголовки
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Размеры
    client_max_body_size 1m;

    # Сжатие — статика летит компактнее
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Блокировка ботов
    if ($block_bot) { return 403; }

    # Не отдаём source maps наружу
    location ~* \.map$ { return 404; }

    # Прокси на Node. Node слушает 52211 по HTTPS со своим self-signed cert
    # (см. server.js). Поэтому используем https:// + отключаем верификацию
    # внутри docker-сети (это безопасно — внутренний bridge).
    location / {
        proxy_pass         https://node_app:52211;
        proxy_ssl_verify   off;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  52211;

        proxy_read_timeout  60s;
        proxy_send_timeout  60s;
        proxy_connect_timeout 5s;

        # WebSocket задел, если потом понадобится
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
