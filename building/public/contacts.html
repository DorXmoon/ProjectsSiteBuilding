<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Контакты - Астрой</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect x='20' y='30' width='60' height='40' fill='%231a5f7a'/><rect x='40' y='10' width='20' height='20' fill='%231a5f7a'/></svg>">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- 3D BACKGROUND -->
<div class="bg-stage" aria-hidden="true">
    <canvas id="bg-canvas"></canvas>
</div>

<main>
    <section class="container">
        <h2>Наши контакты</h2>
        
        <!-- Блок с местоположением -->
        <div class="location-info" style="text-align: center; margin-bottom: 30px; padding: 20px; background: #e8edf2; border-radius: 12px;">
            <h3 style="color: #1a5f7a;">📍 Мы находимся</h3>
            <p style="font-size: 1.1rem;">г. Котельники (Московская область, 2 км от МКАД)</p>
        </div>
        
        <!-- Контакты: 2 колонки на мобильных -->
        <div class="contacts-grid">
            <div class="contact-card" data-copy="phone">
                <div class="icon"><svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5" fill="none"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.362 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.338 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg></div>
                <h3>Телефон</h3>
                <p><a href="#" data-phone-link></a></p>
            </div>
            <div class="contact-card" data-copy="email">
                <div class="icon"><svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5" fill="none"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg></div>
                <h3>Email</h3>
                <p><a href="#" data-email></a></p>
            </div>
            <div class="contact-card">
                <div class="icon"><svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5" fill="none"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></div>
                <h3>График работы</h3>
                <p data-schedule></p>
            </div>
            <div class="contact-card" data-copy="address">
                <div class="icon"><svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5" fill="none"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg></div>
                <h3>Адрес</h3>
                <p data-address></p>
            </div>
        </div>
        
        <!-- КАРТА -->
        <div class="map-container">
            <iframe id="mapFrame" class="map-frame" allowfullscreen
                    loading="lazy" title="Карта проезда"
                    referrerpolicy="no-referrer-when-downgrade"
                    sandbox="allow-same-origin allow-scripts allow-popups allow-forms"></iframe>
        </div>

        <!-- Ссылки на маршруты (CSS сделает нужное выравнивание) -->
        <div class="map-links">
            <a href="https://yandex.com/maps/213/moscow/?ll=37.873034%2C55.658200&mode=routes&rtext=~55.656793%2C37.873296&rtt=comparison&ruri=~ymapsbm1%3A%2F%2Fgeo%3Fdata%3DCgo0MTcwMTIwMjE5Em7QoNC-0YHRgdC40Y8sINCc0L7RgdC60L7QstGB0LrQsNGPINC-0LHQu9Cw0YHRgtGMLCDQmtC-0YLQtdC70YzQvdC40LrQuCwg0LzQuNC60YDQvtGA0LDQudC-0L0g0J_QsNGA0LrQvtCy0YvQuSIKDUJ-F0IVj6BeQg%2C%2C&z=17" target="_blank">📍 Яндекс.Картах (построить маршрут)</a>
            <a href="https://www.google.com/maps/dir/?api=1&destination=55.656793,37.873296" target="_blank">🗺️ Google Maps (построить маршрут)</a>
        </div>

        <!-- Кнопки контактов -->
        <div class="contacts-buttons">
            <a href="#" id="whatsappLink" class="btn btn-secondary">💬 WhatsApp</a>
            <a href="#" id="telegramLink" class="btn btn-secondary">📱 Telegram</a>
        </div>
    </section>
</main>

<script defer src="js/three.min.js"></script>
<script defer src="js/background-3d.js"></script>
<script defer src="js/navigation.js"></script>
<script defer src="js/config.js"></script>
<script defer src="js/main.js"></script>
<script defer src="js/cookie-consent.js"></script>
</body>
</html>
